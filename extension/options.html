<!doctype html>
<meta charset="utf-8">
<title>Bid Tracker Options</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; }
  #status { margin-left: 10px; color: #15803d; }
</style>
<h2>Bid Tracker settings</h2>
<label for="username">Username</label>
<input id="username" placeholder="Your name">
<label for="apiUrl">API URL</label>
<input id="apiUrl" placeholder="http://localhost:4000">
<label for="apiKey">API key</label>
<input id="apiKey" type="password" placeholder="same as API_KEY in backend/.env">
<button id="save">Save</button><span id="status"></span>
<script src="options.js"></script>
